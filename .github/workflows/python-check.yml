name: Python checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q video_downloader.py problem_log_validator.py src scripts tests

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v


  package-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.22.3"
          python -m pip check

      - name: Download pinned portable runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_tools | Out-Null

          $ytDlp = 'build_tools\yt-dlp.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe' -OutFile $ytDlp
          $ytHash = (Get-FileHash $ytDlp -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ytHash -ne '66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a') {
            throw "Unexpected yt-dlp SHA256: $ytHash"
          }

          $denoZip = 'build_tools\deno.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip' -OutFile $denoZip
          $denoHash = (Get-FileHash $denoZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($denoHash -ne 'a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238') {
            throw "Unexpected Deno archive SHA256: $denoHash"
          }
          Expand-Archive -Path $denoZip -DestinationPath build_tools\deno -Force
          $deno = (Get-ChildItem build_tools\deno -Filter deno.exe -Recurse | Select-Object -First 1).FullName
          if (-not $deno) { throw 'deno.exe was not found after extraction' }

          choco install ffmpeg -y --no-progress
          $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $ffmpeg = (Get-ChildItem "$chocoRoot\lib" -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bin\\ffmpeg\.exe$' } | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem "$chocoRoot\lib" -Filter ffprobe.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bin\\ffprobe\.exe$' } | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Real ffmpeg/ffprobe binaries were not found in the Chocolatey package' }

          & $ytDlp --version
          & $deno --version
          & $ffmpeg -version
          & $ffprobe -version

          "YTDLP_BINARY=$((Resolve-Path $ytDlp).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DENO_BINARY=$deno" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_BINARY=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFPROBE_BINARY=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify source before packaging
        shell: pwsh
        run: |
          python -m compileall -q video_downloader.py problem_log_validator.py src scripts tests
          python -m unittest discover -s tests -v

      - name: Build self-contained Windows EXE
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm','--clean','--onefile','--windowed',
            '--name','Universal-Video-Downloader',
            '--add-binary', "$env:YTDLP_BINARY;.",
            '--add-binary', "$env:DENO_BINARY;.",
            '--add-binary', "$env:FFMPEG_BINARY;.",
            '--add-binary', "$env:FFPROBE_BINARY;.",
            'video_downloader.py'
          )
          python -m PyInstaller @args

      - name: Smoke-test packaged EXE and create checksum
        shell: pwsh
        run: |
          $exe = 'dist\Universal-Video-Downloader.exe'
          if (-not (Test-Path $exe)) { throw 'Universal-Video-Downloader.exe was not created' }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($process.ExitCode)" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Universal-Video-Downloader.exe" | Set-Content 'dist\Universal-Video-Downloader.sha256.txt' -Encoding ascii
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-Content 'dist\Universal-Video-Downloader.sha256.txt'

      - name: Upload verified Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Universal-Video-Downloader-Windows-x64
          path: |
            dist/Universal-Video-Downloader.exe
            dist/Universal-Video-Downloader.sha256.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: package-windows
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Require fresh Russian release notes on package pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fxq RELEASE_NOTES_RU.md || {
            echo "RELEASE_NOTES_RU.md must be updated in the same [package] commit."
            exit 1
          }

      - name: Download exact binary built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Universal-Video-Downloader-Windows-x64
          path: release

      - name: Publish GitHub Release with Russian notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="build-$short_sha"
          title="Universal Video Downloader — Windows-сборка $short_sha"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file RELEASE_NOTES_RU.md
            gh release upload "$tag" release/Universal-Video-Downloader.exe release/Universal-Video-Downloader.sha256.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/Universal-Video-Downloader.exe release/Universal-Video-Downloader.sha256.txt               --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title"               --notes-file RELEASE_NOTES_RU.md --prerelease
          fi
