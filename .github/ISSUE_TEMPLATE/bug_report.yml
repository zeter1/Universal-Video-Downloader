name: Сообщить об ошибке
description: Сообщение о проблеме Universal Video Downloader
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Для проблем загрузки особенно важны URL, сайт-источник, выбранное качество, версия yt-dlp и диагностические данные.
        Не публикуйте приватные ссылки, cookie или авторизационные данные.

  - type: input
    id: version
    attributes:
      label: Версия/ревизия программы
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows
      placeholder: "например: Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Сайт-источник
      placeholder: "например: YouTube"
    validations:
      required: true

  - type: input
    id: ytdlp_version
    attributes:
      label: Версия yt-dlp
      description: Если известна.

  - type: textarea
    id: settings
    attributes:
      label: Параметры загрузки
      description: Видео/MP3, выбранное качество, папка сохранения и другие важные параметры.

  - type: textarea
    id: problem
    attributes:
      label: Что произошло
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика
      description: Приложите безопасный фрагмент лога или сообщение yt-dlp/FFmpeg. Уберите cookie, токены и приватные URL.

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил проблему на текущей версии программы и обновлённом yt-dlp.
          required: true
        - label: Я не публикую cookie, токены или приватные ссылки.
          required: true
